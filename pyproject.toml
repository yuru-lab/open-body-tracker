[project]
name = "open-body-tracker"
version = "0.5.0"
description = "Lightweight single-camera full-body 3D pose estimation (23 keypoints, metric 3D)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "opencv-python>=4.10",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
# Training, evaluation and ONNX export need PyTorch.
train = [
    "torch>=2.6",
    "safetensors>=0.4",
    "onnx>=1.17",
    "pycocotools>=2.0.8",
    "huggingface-hub>=0.26",
    "albumentations==1.4.3",
    "opencv-python==5.0.0.93",  # same warp rounding as the release run
    "scipy>=1.13",
]
gpu = ["onnxruntime-gpu>=1.20"]

[project.scripts]
obt-demo = "open_body_tracker.demo:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]
